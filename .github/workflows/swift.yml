name: Swift 6 native development checks
on:
  push:
    branches: ['codex/**', main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: swift-only-${{ github.ref }}
  cancel-in-progress: true
jobs:
  framework:
    name: Compile universal static Swift framework
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify arm64 and x86_64 framework modules and static archives
        run: |
          bash Scripts/build-framework.sh
          CONFIGURATION=Debug bash Scripts/build-framework.sh
          ALLOW_MISSING_CATALOGUE=1 bash Scripts/build-cli.sh
      # This compiler check has no generated catalogue. Release artifacts are only
      # uploaded by build.yml after the complete reference and Metal gates pass.
  native:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Compile Swift 6 API and test native configuration processing
        run: swift test --filter 'YAMLTests|ConfigurationTests|Rules|Native|Grading' 2>&1 | tee swift-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swift-native-tests
          path: swift-tests.log
